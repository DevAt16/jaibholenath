name: jbn-discovery
services:
  jbn-discovery:
    build: .
    image: jbn-discovery:2026-09-30
    container_name: jbn-discovery
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 1h
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: ./worker.env
        format: raw
    environment:
      TZ: Asia/Kolkata
      JBN_LIVE_ENABLED: ${JBN_LIVE_ENABLED:-false}
    secrets: [control_token]
    volumes:
      - ../../data/jai-bholenath/expansion:/app/reports/expansion
      - ../../data/jai-bholenath/control:/app/state
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [n8n, monitoring]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
secrets:
  control_token:
    file: ./control-token.txt
networks:
  n8n:
    external: true
    name: n8n_default
  monitoring:
    external: true
    name: uptime-kuma_default
