name: MySQL backend tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      MYSQL_TEST_DATABASE_URL: mysql://root:test-only-password@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: visitor-api/package-lock.json
      - run: npm ci
        working-directory: visitor-api
      - run: npm test
        working-directory: visitor-api
      - run: npm run build
        working-directory: visitor-api
